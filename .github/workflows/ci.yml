name: CI

# macos-26 is the current stable image (macOS 26.6, Xcode 26.6 by default).
# xcode-27 is the preview image with macOS 27 and Xcode 27, the toolchain the app is developed on;
# a failure there is reported but does not fail the workflow while the image is a preview.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  swiftlint:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint
        run: swiftlint lint --strict

  test:
    name: test (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            preview: false
          - runner: xcode-27
            preview: true
    steps:
      - uses: actions/checkout@v7

      - name: Toolchain
        run: |
          xcodebuild -version
          swift --version

      - name: Test the Swift package
        run: swift test

  build-app:
    name: build app (${{ matrix.runner }})
    runs-on: ${{ matrix.runner }}
    continue-on-error: ${{ matrix.preview }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-26
            preview: false
          - runner: xcode-27
            preview: true
    steps:
      - uses: actions/checkout@v7

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Build the app and the extension, unsigned
        run: |
          xcodegen generate
          xcodebuild -project MailBlocker.xcodeproj -scheme MailBlocker \
            -configuration Debug -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" build
